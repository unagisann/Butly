name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app.py main.py dependencies.py butly_core routers tests

      - name: Check fatal lint errors
        run: python -m flake8 --select=E9,F63,F7,F82 app.py main.py dependencies.py butly_core routers tests

      - name: Run tests
        run: python -m pytest -m "not integration"
