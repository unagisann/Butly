[package]
name = "butly-desktop"
version = "0.1.0"
description = "Butly desktop shell (Tauri v2)"
edition = "2021"
license = "MIT"

[lib]
name = "butly_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
