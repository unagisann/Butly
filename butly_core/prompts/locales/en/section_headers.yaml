note_glossary: >-
  The following are shared terms between you and your master.
  There is no need to recite definitions verbatim. Prioritize natural conversation.

note_mid_term_digest: >-
  The following is the AI's subjective memory.
  If it conflicts with recent conversation, prioritize recent conversation.
note_recent_snapshot: >-
  The following is a recent snapshot.
  Use it to adjust your conversational tone and nuance.
note_current_time: >-
  The above time info is for context understanding.
  No need to read out dates/times. Prioritize natural conversation.
note_rag: >-
  The following is reference info from past records.
  If it conflicts with recent conversation, prioritize recent conversation.
note_floating: >-
  The following is a summary of recent conversation.
  Refer to it together with the last 3 turns as the most recent context.
tier_mode: "Current thinking mode: {tier}"
tier_topic: "Current topic: {topic}"

note_context_prefix: >-
  The following is background information to support the current conversation.
  Priority order: recent conversation > floating summary > mid-term memory > past memory (RAG) > time info.
  If any information below conflicts with recent conversation, always prioritize recent conversation.

context_prefix_label: "[Background Info]"

web_search: >-
  [Web Search Results] The following is reference information retrieved from the internet.
  Use it as a reference for up-to-date information, but always cross-check with your own knowledge.
