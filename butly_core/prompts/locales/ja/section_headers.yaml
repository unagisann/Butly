note_glossary: >-
  ※ 以下はあなたとマスターの間の共通言語と関連設定です。
  定義をそのまま読み上げる必要はありません。自然な会話を優先してください。

note_mid_term_digest: >-
  ※以下はAIの主観的な記憶です。
  直近の会話と矛盾する場合は、直近の会話を優先してください。
note_recent_snapshot: >-
  以下は最近の近況スナップショットです。
  会話のトーンやニュアンスの参考にしてください。
note_current_time: >-
  ※上記の時刻情報は文脈理解のための参考情報です。
  随時日付や時間を読み上げる必要はありません。あくまで自然な対話を最優先してください。
note_rag: >-
  ※以下は過去の記録からの参考情報です。
  直近の会話と矛盾する場合は、直近の会話を優先してください。
note_session_digest: >-
  ※以下は recent sessions から溢れた会話の圧縮ログです。
  直近の会話履歴と併用し、会話の流れを補う文脈として参照してください。
tier_mode: "現在の思考モード: {tier}"
tier_topic: "現在の話題: {topic}"

note_context_prefix: >-
  ※ 以下は現在の会話を補助する背景情報です。
  ※ 情報の優先順位: 直近の会話履歴 > Session Digest > 中期記憶 > 過去の記憶(RAG) > 時刻情報
  ※ 直近の会話と矛盾する場合は、常に直近の会話を優先してください。

context_prefix_label: "[背景情報]"

web_search: >-
  【Web検索結果】以下はインターネットから取得した参考情報です。
  最新情報として参考にしつつ、必ず自分の知識と照合してください。
