rag_date_note: >-
  各記憶の [YYYY-MM-DD] は、説明された出来事の日付とは限らず、根拠となる会話の日付です。
  相対的な時間表現は、その表現を含む根拠会話抜粋のタイムスタンプを基準に解釈してください。
  根拠が示す日付粒度を保ち、それ以上に細かい精度を推測しないでください。
