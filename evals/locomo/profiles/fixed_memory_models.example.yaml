# Fixed Memory Pipeline Profile — memory roles stay constant, only the chat
# model changes between runs, so score differences isolate the chat model.
# Copy to fixed_memory_models.yaml and set real connection ids / model names.
name: fixed_memory_pipeline

# Internal prompt/memory locale. CLI --locale takes precedence; omitted values
# default to English. Official LoCoMo QA answers remain English for scoring.
locale: en

chat:
  connection: evaluation_target
  model_name: target-model

gatekeeper:
  connection: fixed
  model_name: fixed-model
  # If fixed-model is a reasoning model, uncomment: thinking alone can eat
  # the default 512-token output budget and empty the classification.
  # generation_config:
  #   max_output_tokens: 2048

summary:
  connection: fixed
  model_name: fixed-model

knowledge:
  connection: fixed
  model_name: fixed-model

embedding:
  connection: fixed
  model_name: fixed-embedding
