# Full Local Profile — one local chat LLM serves every text-generation role,
# plus a dedicated embedding model for RAG.
#
# Copy to full_local.yaml and edit the connection ids / model names.
# Define both connections in user_config.json LLM_CONNECTIONS
# (protocol: openai_compat). Butly needs a real embedding endpoint for RAG:
# a chat LLM cannot answer /v1/embeddings, so the embedding role must point at
# an embeddings-capable server (e.g. llama.cpp started with --embeddings, or a
# separate embedding model), NOT the chat connection.
#
# Question answered by this profile: "can this model run all of Butly?"
name: full_local

# Internal prompt/memory locale. CLI --locale takes precedence; omitted values
# default to English. Official LoCoMo QA answers remain English for scoring.
# This is kept in the profile so the prompt choice is reproducible without
# relying on the machine-wide Butly locale.
locale: en

chat:
  connection: colab_local
  model_name: qwen3-14b

gatekeeper:
  connection: colab_local
  model_name: qwen3-14b
  # Reasoning models think before answering, and the thinking alone can
  # consume the default 512-token output budget — the classification then
  # comes back empty and Butly falls back to rule-based need_intent.
  # 2048 leaves room; the JSON itself needs only ~100 tokens.
  generation_config:
    max_output_tokens: 2048

summary:
  connection: colab_local
  model_name: qwen3-14b

knowledge:
  connection: colab_local
  model_name: qwen3-14b

# Separate embedding server — do not reuse the chat connection.
embedding:
  connection: local_embedding
  model_name: nomic-embed-text

# Non-model override: what the RAG block injects into the prompt.
# Cards are lossy compression — extraction can drop event dates or status
# facts. "both" keeps the cards as the search index and appends the original
# conversation excerpts they were built from (parent-document retrieval),
# resolved via each card's source_files. "cards" is the pre-v12 behaviour,
# "raw" injects only the excerpts. rag_raw_max_chars caps the total excerpt
# size in characters (0 = unlimited).
memory:
  rag_source_mode: both
  rag_raw_max_chars: 6000
